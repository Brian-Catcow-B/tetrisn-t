# cargo-features = ["named-profiles"]

[package]
name = "tetrisn-t"
version = "0.2.0"
authors = ["Brian \"Catcow\" B"]
edition = "2018"

[profile.dev]
opt-level = 0
overflow-checks = false  # used in ./src/game/piece.rs when rotating and moving pieces left

[profile.release]
opt-level = 3

[dependencies]
ggez = "0.10"
rand = "0.7.3"
glam = "0.19.0"
